# S-Care — Render Blueprint (https://render.com/docs/blueprint-spec)
# External: Neon (Postgres), HiveMQ Cloud (MQTT), InfluxDB Cloud Serverless.

services:
  - type: web
    name: s-care-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: s-care-backend
    runtime: docker
    region: singapore
    plan: free # 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: s-care-redis
          property: connectionString
      - key: INFLUX_HOST
        sync: false
      - key: INFLUX_TOKEN
        sync: false
      - key: INFLUX_DATABASE
        value: scare_raw
      - key: INFLUX_DATABASE_1M
        value: scare_1m
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC_PREFIX
        value: scare/devices

  - type: keyvalue
    name: s-care-redis
    region: singapore
    plan: free
    ipAllowList: [] # private network only
