# ──────────────────────────────────────────────────────────────
# S-Care — Render Blueprint
# https://render.com/docs/blueprint-spec
#
# The MQTT broker is HiveMQ Cloud (external), so it is not deployed here.
# Values marked `sync: false` are asked for once, when the Blueprint is created.
# ──────────────────────────────────────────────────────────────

services:
  # ── Frontend: React + Vite, served by `vite preview` ──
  - type: web
    name: s-care-web
    runtime: node
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"

  # ── Backend: Express REST API + MQTT subscriber (one process) ──
  - type: web
    name: s-care-backend
    runtime: docker
    region: singapore
    # Paid on purpose: free instances sleep after 15 min without inbound HTTP
    # traffic, which would drop the MQTT subscription.
    plan: 0.5c-512mb
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # HiveMQ Cloud: mqtts://<cluster-id>.s1.eu.hivemq.cloud:8883
      - key: MQTT_BROKER_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC_PREFIX
        value: scare/devices
